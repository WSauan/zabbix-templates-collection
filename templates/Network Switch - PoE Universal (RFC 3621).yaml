zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: a8b2c3d4e5f647898101112131415161
      template: 'Network Switch - PoE Universal'
      name: 'Network Switch - PoE Universal'
      description: |
        Template Universal para monitoramento de PoE baseado na RFC 3621 (POWER-ETHERNET-MIB).
        - Compatível com switches HP/Aruba, Cisco, Huawei e outros que seguem o padrão RFC.
        - Descoberta automática: Só gera itens em portas que suportam e entregam energia PoE.
      groups:
        - name: Templates
      discovery_rules:
        - uuid: 8f9e0a1b2c3d4e5f67890123456789ab
          name: 'Descoberta de Portas PoE (RFC 3621)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSE_PORT_INDEX},1.3.6.1.2.1.105.1.1.1.3.1]'
          key: snmp.poe.universal.discovery
          delay: 1h
          item_prototypes:
            - uuid: 11223344556677889900aabbccddeeff
              name: 'PoE Porta Index [{#PSE_PORT_INDEX}]: Consumo de Potência'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.105.1.1.1.6.1.{#SNMPINDEX}'
              key: 'poe.power.mw[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: W
              description: 'Potência consumida na porta PoE em Watts (convertida de mW).'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: PortaIndex
                  value: '{#PSE_PORT_INDEX}'
                - tag: Sensor
                  value: 'Potencia_W'
            - uuid: 99887766554433221100ffeeffeeddcc
              name: 'PoE Porta Index [{#PSE_PORT_INDEX}]: Status da Porta'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.105.1.1.1.3.1.{#SNMPINDEX}'
              key: 'poe.status[{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                Status do PoE na porta conforme a RFC 3621:
                1: delegatingPower (Fornecendo energia)
                2: emulatingSensors
                3: commitFailed
                4: assessing
                5: lowVoltage
                6: overLoad
                7: test
              valuemap:
                name: 'PoE Port Status'
              tags:
                - tag: PortaIndex
                  value: '{#PSE_PORT_INDEX}'
                - tag: Sensor
                  value: 'Status'
          graph_prototypes:
            - uuid: 3344556677889900aabbccddeeff11223
              name: 'PoE Porta Index [{#PSE_PORT_INDEX}]: Potência Consumida'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 00AAFF
                  item:
                    host: 'Network Switch - PoE Universal'
                    key: 'poe.power.mw[{#SNMPINDEX}]'
      valuemaps:
        - uuid: 554433221100ffeeffeeddcc11223344
          name: 'PoE Port Status'
          mappings:
            - value: '1'
              newvalue: 'Fornecendo Energia'
            - value: '4'
              newvalue: 'Avaliando'
            - value: '6'
              newvalue: 'Sobrecarga'
      tags:
        - tag: Template
          value: PoE